services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: survivor
      POSTGRES_PASSWORD: survivor
      POSTGRES_DB: survivor
    ports:
      - "5432:5432"
    volumes:
      - survivor-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - survivor-redis-data:/data

volumes:
  survivor-postgres-data:
  survivor-redis-data:
